services:
  - type: web
    name: futurefunds
    runtime: docker
    plan: free
    region: singapore           # MUST match the Neon project region (see deployment.md §4.1).
                                  # Singapore <-> Singapore is <1 ms; cross-region adds
                                  # 100-300 ms per query. Render does NOT let you change
                                  # the region of an existing service — recreate from the
                                  # Blueprint if the region ever needs to move.
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    # NOTE: `runtime: docker` means Render runs the Dockerfile's
    # CMD as the container's main process. Render's blueprint schema
    # rejects a `startCommand` field when runtime is docker (it would
    # only apply for `runtime: python` or `runtime: node`). The
    # `alembic upgrade head && uvicorn ...` chain therefore lives in
    # the Dockerfile's CMD line (see C11 in deployment.md).
    envVars:
      - key: FF_APP_ENV
        value: production
      - key: FF_DEBUG
        value: "false"
      - key: FF_DATABASE_URL
        sync: false               # set in Render UI; secret
      - key: FF_SESSION_SECRET
        generateValue: true       # Render generates and stores
      - key: FF_SESSION_COOKIE_SECURE
        value: "true"
      - key: FF_ALLOWED_HOSTS
        # MUST exactly match the hostname the service is served under.
        # The auto-generated `*.onrender.com` URL is built from the
        # service name above (`name: futurefunds`), so this becomes
        # `futurefunds.onrender.com`. Add custom domains as a
        # comma-separated list, e.g. `futurefunds.onrender.com,app.example.com`.
        # If you change this wrong, Render's `/healthz` probe returns
        # 400 and the deploy times out (see deployment.md §4.5/§4.8).
        value: "futurefunds.onrender.com"
      - key: FF_GOOGLE_CLIENT_ID
        sync: false
      - key: FF_GOOGLE_CLIENT_SECRET
        sync: false
      - key: FF_GOOGLE_REDIRECT_URI
        # MUST exactly match what you register in Google Cloud Console
        # under APIs & Services → Credentials → Authorized redirect URIs.
        # Same hostname as FF_ALLOWED_HOSTS above.
        value: "https://futurefunds.onrender.com/auth/google/callback"
      - key: FF_DEFAULT_CURRENCY
        value: "INR"
      - key: FF_CURRENCY_SYMBOL
        value: "₹"
      - key: FF_LOG_LEVEL
        value: "INFO"
      - key: PORT
        value: "8000"             # Render injects $PORT=8000 so the
                                  # Dockerfile HEALTHCHECK (which uses
                                  # 127.0.0.1:8000) keeps working in
                                  # local `docker run` scenarios.
