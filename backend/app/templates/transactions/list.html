{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold tracking-tight">Transactions</h1>
    <a href="/transactions/new" class="inline-flex items-center gap-1.5 rounded-lg bg-accent-600 px-4 py-2 text-sm font-medium text-white hover:bg-accent-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add transaction
    </a>
  </div>

  <!-- Filters -->
  <form
    hx-get="/transactions"
    hx-target="#transaction-list"
    hx-swap="innerHTML"
    class="flex flex-wrap items-end gap-3 rounded-lg border border-neutral-200 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-900"
  >
    <div>
      <label for="filter-account" class="block text-xs font-medium text-neutral-500 dark:text-neutral-400">Account</label>
      <select id="filter-account" name="account" class="mt-1 block rounded-lg border border-neutral-300 bg-white px-3 py-1.5 text-sm text-neutral-900 focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100">
        <option value="">All</option>
        {% for a in accounts %}
        <option value="{{ a.id }}" {% if filter_account_id == a.id %}selected{% endif %}>{{ a.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="filter-type" class="block text-xs font-medium text-neutral-500 dark:text-neutral-400">Type</label>
      <select id="filter-type" name="type" class="mt-1 block rounded-lg border border-neutral-300 bg-white px-3 py-1.5 text-sm text-neutral-900 focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100">
        <option value="">All</option>
        <option value="expense" {% if filter_type == "expense" %}selected{% endif %}>Expense</option>
        <option value="income" {% if filter_type == "income" %}selected{% endif %}>Income</option>
        <option value="transfer" {% if filter_type == "transfer" %}selected{% endif %}>Transfer</option>
      </select>
    </div>
    <div>
      <label for="filter-from" class="block text-xs font-medium text-neutral-500 dark:text-neutral-400">From</label>
      <input type="date" id="filter-from" name="from" value="{{ filter_date_from }}"
        class="mt-1 block rounded-lg border border-neutral-300 bg-white px-3 py-1.5 text-sm text-neutral-900 focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100" />
    </div>
    <div>
      <label for="filter-to" class="block text-xs font-medium text-neutral-500 dark:text-neutral-400">To</label>
      <input type="date" id="filter-to" name="to" value="{{ filter_date_to }}"
        class="mt-1 block rounded-lg border border-neutral-300 bg-white px-3 py-1.5 text-sm text-neutral-900 focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100" />
    </div>
    <div>
      <label for="filter-q" class="block text-xs font-medium text-neutral-500 dark:text-neutral-400">Search</label>
      <input type="text" id="filter-q" name="q" value="{{ filter_description }}" placeholder="description..."
        class="mt-1 block w-36 rounded-lg border border-neutral-300 bg-white px-3 py-1.5 text-sm text-neutral-900 placeholder-neutral-400 focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100" />
    </div>
    <button type="submit" class="rounded-lg bg-accent-600 px-4 py-1.5 text-sm font-medium text-white hover:bg-accent-700">Filter</button>
  </form>

  <!-- Transaction list -->
  <div id="transaction-list">
    {% include "partials/transaction_list_items.html" %}
  </div>
</div>
{% endblock %}
