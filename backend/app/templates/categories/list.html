{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold tracking-tight">Categories</h1>
    <a href="/categories/new" class="inline-flex items-center gap-1.5 rounded-lg bg-accent-600 px-4 py-2 text-sm font-medium text-white hover:bg-accent-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add category
    </a>
  </div>

  {% if categories %}
  <div id="category-list" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    {% for cat in categories %}
      {% include "partials/category_card.html" %}
    {% endfor %}
  </div>
  {% else %}
  <div class="rounded-lg border border-dashed border-neutral-300 p-12 text-center dark:border-neutral-700">
    <p class="text-neutral-500 dark:text-neutral-400">No categories yet.</p>
    <a href="/categories/new" class="mt-2 inline-block text-sm font-medium text-accent-600 hover:text-accent-700">Add your first category</a>
  </div>
  {% endif %}
</div>
{% endblock %}
