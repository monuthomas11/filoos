<div
  id="category-card-{{ cat.id }}"
  class="group rounded-lg border border-neutral-200 bg-white p-4 transition hover:shadow-sm dark:border-neutral-800 dark:bg-neutral-900"
>
  <div class="flex items-start justify-between">
    <div class="flex items-center gap-3">
      <span
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-lg font-bold text-white"
        style="background-color: {{ cat.color or '#7c3aed' }}"
      >
        {{ cat.name[:1] }}
      </span>
      <div>
        <p class="font-semibold text-neutral-900 dark:text-neutral-100">{{ cat.name }}</p>
        <p class="text-xs text-neutral-500 dark:text-neutral-400">{{ cat.type.value|title }}</p>
      </div>
    </div>
    <div class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100">
      <a
        href="/categories/{{ cat.id }}/edit"
        class="inline-flex h-7 w-7 items-center justify-center rounded text-neutral-400 hover:bg-neutral-100 hover:text-neutral-700 dark:hover:bg-neutral-800 dark:hover:text-neutral-300"
        title="Edit"
        aria-label="Edit {{ cat.name }}"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      </a>
      <button
        hx-delete="/categories/{{ cat.id }}"
        hx-target="#category-card-{{ cat.id }}"
        hx-swap="outerHTML swap:0.3s"
        hx-confirm="Delete '{{ cat.name }}'?"
        class="inline-flex h-7 w-7 items-center justify-center rounded text-neutral-400 hover:bg-red-50 hover:text-negative-600 dark:hover:bg-red-950 dark:hover:text-negative-500"
        title="Delete"
        aria-label="Delete {{ cat.name }}"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>
  </div>
</div>
