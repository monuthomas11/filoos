[project]
name = "filoos"
version = "0.1.0"
description = "Filoos - a personal expense tracker with a lightweight dashboard and balance predictions."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Filoos" }]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "jinja2>=3.1.4",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "statsmodels>=0.14.0",
  "python-dateutil>=2.9.0",
  "python-multipart>=0.0.12",
  "authlib>=1.2.0",
  "httpx>=0.27.0",
  "itsdangerous>=2.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx2>=2.5.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]
